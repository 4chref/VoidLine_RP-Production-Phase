<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Armory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="armory" class="armory-container hidden">
        <div class="armory-header">
            <span class="armory-header-spacer"></span>
            <h1 class="armory-title">Armory</h1>

        </div>
        <div class="armory-subtitle">Standard-Issue Equipment</div>
        <div class="armory-grid" id="armoryGrid"></div>
        <div class="notification-container" id="notificationContainer"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
