<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Basic Needs HUD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="hud" class="hud-container position-middle-right">
        <div class="need-row" id="row-poop">
            <div class="need-body">
                <div class="need-top">
                    <div class="need-label">Poop</div>
                    <div class="need-pct">0%</div>
                </div>
                <div class="pills">
                    <div class="pill" data-i="0"></div>
                    <div class="pill" data-i="1"></div>
                    <div class="pill" data-i="2"></div>
                    <div class="pill" data-i="3"></div>
                </div>
            </div>
        </div>

        <div class="need-row" id="row-sleep">
            <div class="need-body">
                <div class="need-top">
                    <div class="need-label">Sleep</div>
                    <div class="need-pct">0%</div>
                </div>
                <div class="pills">
                    <div class="pill" data-i="0"></div>
                    <div class="pill" data-i="1"></div>
                    <div class="pill" data-i="2"></div>
                    <div class="pill" data-i="3"></div>
                </div>
            </div>
        </div>

        <div class="need-row" id="row-pee">
            <div class="need-body">
                <div class="need-top">
                    <div class="need-label">Pee</div>
                    <div class="need-pct">0%</div>
                </div>
                <div class="pills">
                    <div class="pill" data-i="0"></div>
                    <div class="pill" data-i="1"></div>
                    <div class="pill" data-i="2"></div>
                    <div class="pill" data-i="3"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
