<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="boGlow" cx="50%" cy="44%" r="52%">
      <stop offset="0%" stop-color="#FFD08A"/>
      <stop offset="38%" stop-color="#FF8A1E"/>
      <stop offset="72%" stop-color="#E2400C"/>
      <stop offset="100%" stop-color="#E2400C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0A8"/>
      <stop offset="100%" stop-color="#FF7A12"/>
    </linearGradient>
    <filter id="boBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.9"/>
    </filter>
    <filter id="boSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <!-- dust halo -->
  <circle cx="18" cy="16" r="15" fill="url(#boGlow)" opacity="0.75"/>

  <!-- diffused sun, no sharp edge -->
  <circle cx="18" cy="15.5" r="6.6" fill="url(#boDisc)" filter="url(#boBlur)" opacity="0.95"/>
  <circle cx="18" cy="15.5" r="4.2" fill="#FFCF83" filter="url(#boSoft)" opacity="0.9"/>

  <!-- haze bands cutting the sun -->
  <g filter="url(#boSoft)" opacity="0.85">
    <rect x="3.5" y="17.6" width="29" height="1.7" rx="0.85" fill="#C33A0B"/>
    <rect x="6.5" y="21.0" width="23" height="1.5" rx="0.75" fill="#A82F08"/>
  </g>

  <!-- dark silhouette ridge -->
  <path d="M2 30.2 L7.4 25.6 L10.8 28.1 L14.6 24.0 L18.4 27.6 L22.1 23.4 L26.4 27.9 L29.6 25.4 L34 30.2 Z"
        fill="#4A1405"/>
  <rect x="2" y="29.6" width="32" height="3.2" rx="1.2" fill="#3A0F03"/>
</svg>
